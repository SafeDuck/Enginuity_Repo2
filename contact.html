<h1>Contact Us</h1>
<p>Email: example@email.com</p>

<div class="box blue-box">
  <p>Reach out to us!</p>
</div>

<form
  action="#"
  method="POST"
  style="
    max-width: 500px;
    margin: 20px auto;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    text-align: left;
  "
>
  <div style="margin-bottom: 15px">
    <label
      for="name"
      style="display: block; margin-bottom: 5px; font-weight: bold"
      >Name:</label
    >
    <input
      type="text"
      id="name"
      name="name"
      required
      style="
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
      "
    />
  </div>
  <div style="margin-bottom: 15px">
    <label
      for="email"
      style="display: block; margin-bottom: 5px; font-weight: bold"
      >Email:</label
    >
    <input
      type="email"
      id="email"
      name="email"
      required
      style="
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
      "
    />
  </div>
  <div style="margin-bottom: 15px">
    <label
      for="message"
      style="display: block; margin-bottom: 5px; font-weight: bold"
      >Message:</label
    >
    <textarea
      id="message"
      name="message"
      rows="5"
      required
      style="
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        resize: vertical;
      "
    ></textarea>
  </div>
  <button
    type="submit"
    style="
      background-color: #228b22;
      color: white;
      padding: 30px 40px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 40px;
    "
  >
    Send Message
  </button>
</form>

<footer
  style="
    margin-top: 40px;
    padding: 20px;
    background-color: #f0f0f0;
    color: #333;
    font-size: 14px;
    text-align: center;
  "
>
  <p>&copy; 2023 Our Collaborative Project. All rights reserved.</p>
</footer>
